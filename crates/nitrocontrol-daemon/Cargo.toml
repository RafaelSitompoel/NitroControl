[package]
name = "nitrocontrol-daemon"
version = "0.1.0"
edition = "2021"
authors = ["NitroControl Contributors"]
description = "Desktop daemon, local API server, and background monitor for NitroControl"
license = "MIT"

[dependencies]
nitrocontrol-core = { path = "../nitrocontrol-core" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
